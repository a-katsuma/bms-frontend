server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 日本語や記号が化けないように、HTML・CSS・JS を UTF-8 として配信する
    charset utf-8;
    charset_types text/css application/javascript text/plain application/json;

    # ビルドしたファイル（名前にハッシュが付く）は長くキャッシュしてよい
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 画面の URL（/projects/193 など）を直接開いたときは index.html を返し、React Router に任せる
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html は毎回確認させる（新しいビルドがすぐ反映されるように）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
