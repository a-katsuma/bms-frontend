# master に push したら、Docker のイメージを作って GitHub のイメージ置き場（GHCR）に置く
name: Docker image

on:
  push:
    branches: [master]
  workflow_dispatch: # GitHub の画面から、手動でも実行できる

permissions:
  contents: read
  packages: write # GHCR にイメージを置くため

env:
  IMAGE: ghcr.io/a-katsuma/bms-frontend # GHCR の名前は小文字だけ

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: GHCR にログイン
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub が自動で用意するトークン（自分で作らなくてよい）

      - name: タグを決める（latest と、コミットごとの sha-xxxxxxx）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: イメージを作って置く
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # 前回のビルドを使い回して速くする
          cache-to: type=gha,mode=max
